name: Habliko Bluesky Video Publisher

on:
  schedule:
    # 2 videos al dia (UTC). 10:00 y 20:00 UTC = 12:00 y 22:00 en Luxemburgo (verano).
    - cron: "0 10 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: habliko-bluesky-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python3 publish.py
      - name: Commit progress
        if: success()
        run: |
          git config user.name "habliko-bot"
          git config user.email "bot@habliko.com"
          if [ -n "$(git status --porcelain progress.json)" ]; then
            git add progress.json
            git commit -m "chore: progreso [skip ci]"
            git push
          fi
